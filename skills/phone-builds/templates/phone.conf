# phone.conf: the only per-app file. phone.sh and ship.sh read it.
# Values shown are Wildcard's (~/calendar/ActivityApp); replace every one.

APP_NAME="Wildcard"                 # shown in messages and on the download page
APP_SLUG="wildcard"                 # file names: dist/$APP_SLUG.apk
BUNDLE_ID="com.locklainn.wildcard"  # Android applicationId / iOS bundle id (used to launch after install)

# Run before the native builds, from the repo root. Empty for Expo/React Native (the release
# build bundles the JS itself). Capacitor/Ionic: "npm run build && npx cap sync".
PREBUILD=""

ANDROID_DIR="android"
# Which Gradle build: release (default), or debug when the copies already on phones came from
# debug builds. A phone refuses an update signed with a different key than its installed copy.
ANDROID_VARIANT="release"
# A JDK 17+ to build with, when neither Android Studio's nor /usr/libexec/java_home's will do.
JDK_HOME=""
# React Native/Expo only: real phones are ARM, and dropping the x86 emulator ABIs halves
# the APK. Leave empty for Capacitor or anything without native code per ABI.
ANDROID_ABIS="arm64-v8a,armeabi-v7a"

IOS_WORKSPACE="ios/Wildcard.xcworkspace"   # Capacitor: ios/App/App.xcworkspace
IOS_SCHEME="Wildcard"                      # Capacitor: App

# Download link (Android). See SKILL.md, "One-time: the R2 bucket".
R2_BUCKET="wildcard-builds"
R2_PUBLIC="https://pub-92238e09aec144d696c5a5b7dbc9f6f6.r2.dev"
WRANGLER_DIR="server"               # a folder whose node_modules has wrangler ("." for the root)
SHIP_TOKEN_FILE="$HOME/.wildcard_ship"   # the secret part of the link; never in the repo
OWNER="TJ"                          # who iPhone users should ask, on the download page

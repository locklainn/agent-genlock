# phone.conf: genlock's phone app (native Kotlin, mobile/android). phone.sh reads it.
# From the phone-builds skill (skills/phone-builds); see its "Native Android" notes.

APP_NAME="Genlock"
APP_SLUG="genlock"
BUNDLE_ID="com.locklainn.genlock"

PREBUILD=""                 # native: Gradle builds everything

ANDROID_DIR="android"
# debug: every copy on a phone so far came from assembleDebug, signed with this Mac's debug
# key. A release build signed with any other key would be refused as an update. Switching is
# TJ's call (skill: "Signing"), and costs each phone an uninstall.
ANDROID_VARIANT="debug"
ANDROID_ABIS=""             # no native code per ABI
JDK_HOME="$HOME/dev-tools/jdk17/Contents/Home"   # Gradle 8 needs 17; the shell's is often older

IOS_WORKSPACE=""            # no iPhone app yet
IOS_SCHEME=""

# Download link: mobile/ship_android.sh does this here (it predates the skill's ship.sh).
R2_BUCKET="genlock-builds"
R2_PUBLIC="https://pub-9940b8a7001844d88ff982b0fc52632e.r2.dev"
WRANGLER_DIR="$HOME"
SHIP_TOKEN_FILE="$HOME/.genlock_ship"
OWNER="TJ"
